# A tree trunk. Logs can lie along any axis, so the block has three states:
# the rings (log_top) face the ends of the axis. Format: see stone.toml.
name = "oak_log"
display_name = "Oak Log"
layer = "opaque"

[textures]
all = "oak_log_side"

[[variants]]
properties = { axis = "y" }
textures = { top = "oak_log_top", bottom = "oak_log_top" }

[[variants]]
properties = { axis = "x" }
textures = { east = "oak_log_top", west = "oak_log_top" }

[[variants]]
properties = { axis = "z" }
textures = { south = "oak_log_top", north = "oak_log_top" }
