# Snow lying on the ground in layers of 2 pixels, up to a whole block, like
# fallen snow. Placing snow on top of a layer adds one. Format: see stone.toml.
name = "snow"
display_name = "Snow"
category = "Nature"
layer = "opaque"
light_opacity = 0
replaceable = true
needs_support = true

