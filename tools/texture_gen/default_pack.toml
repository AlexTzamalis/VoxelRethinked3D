[[texture]]
key = "grass_top"
pattern = "grass_top"
palette = ["#3c7524", "#47862b", "#529531", "#5da237", "#6cb442"]
density = 0.5

[[texture]]
key = "grass_side"
pattern = "overhang"
base = "dirt"
accent = ["#3c7524", "#47862b", "#529531", "#5da237"]
density = 0.5

[[texture]]
key = "sand"
pattern = "speckle"
palette = ["#c4ae76", "#cfbb84", "#d9c791", "#e1d19e", "#e9dcaf"]
