# Recipes of the default texture pack (G2.1). vxe_texture_gen paints one
# blocks/<key>.png per [[texture]] into textures/default/:
#
#   vxe_texture_gen tools/texture_gen/default_pack.toml textures/default
#
# Existing PNGs are kept (hand edits survive); --force repaints them, --only
# key,key limits the run. Each texture has:
#
#   key       the texture key blocks refer to (blocks/<key>.png)
#   pattern   speckle, stone, grass_top, overhang, gravel, water, bark,
#             rings, leaves, glass, glow or ore
#   palette   colors from dark to light ("#rrggbb" or "#rrggbbaa")
#   accent    a second palette (grass over dirt, ore over stone, bark rims)
#   base      another key painted first (ores on stone, grass sides on dirt)
#   density   how much of a pattern's extras (speckles, cracks, holes, ore)
#   scale     feature size, 1 is the pattern's normal size
#   alpha     opacity for translucent textures (water, glass)
#   seed      changes the random layout of this texture only
#
# To add a material: copy the closest recipe, change key and palette, run
# the generator; new looks are new patterns in tools/texture_gen/painter.cpp.

[pack]
name = "Voxel Rethinked Default"
author = "Alex Tzamalis"
version = "1.0.0"
description = "The original default pack, generated, then refined by hand."
resolution = 16
seed = 1
icon = ["grass_side", "stone", "oak_log_top", "oak_leaves"]

[[texture]]
key = "stone"
pattern = "stone"
palette = ["#505055", "#6a6a6f", "#76767b", "#818186", "#8c8c91", "#98989d"]
density = 0.5

[[texture]]
key = "dirt"
pattern = "speckle"
palette = ["#4b3322", "#5c3f2d", "#6a4935", "#77543e", "#845e46"]
